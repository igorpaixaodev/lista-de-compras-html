<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Organize suas compras de forma simples e bonita">
<meta name="theme-color" content="#f97ba8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Minha Lista">
<title>Minha Lista de Compras</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect fill='%23f97ba8' width='192' height='192'/%3E%3Ctext x='50%25' y='50%25' font-family='system-ui' font-size='120' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='central'%3E🛒%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #f97ba8;
    --primary-light: #fcd6e3;
    --primary-lighter: #fde9f0;
    --accent: #f97ba8;
    --accent-soft: rgba(249, 123, 168, 0.1);
    --success: #6ec66c;
    --danger: #e74c3c;
    --bg: #fafafa;
    --bg-secondary: #fff;
    --border: #e8d5e0;
    --text: #3a3a3a;
    --text-light: #666;
    --text-lighter: #999;
    --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
    --radius: 12px;
    --radius-lg: 16px;
  }

  *, *::before, *::after { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
  }

  body {
    font-family: 'Poppins', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    line-height: 1.6;
  }

  /* ── SCREENS ── */
  .screen { display: none; animation: fadeIn 0.3s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ── HEADER ── */
  header {
    padding: 24px 16px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    max-width: 100%;
    margin: 0 auto;
  }

  .logo {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: 1.5rem;
    color: var(--primary);
    text-align: center;
    letter-spacing: -0.02em;
  }

  /* ── HERO ── */
  .hero {
    padding: 24px 16px;
    text-align: center;
    background: linear-gradient(135deg, rgba(249,123,168,0.05) 0%, rgba(249,123,168,0.02) 100%);
  }

  .hero h1 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: clamp(1.8rem, 8vw, 2.2rem);
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }

  .hero h1 .accent { color: var(--primary); }

  .hero p {
    color: var(--text-light);
    font-size: 0.95rem;
    font-weight: 300;
  }

  /* ── LISTS SCREEN ── */
  .lists-container {
    max-width: 100%;
    margin: 0 auto;
    padding: 16px;
  }

  .new-list-btn {
    width: 100%;
    padding: 16px;
    border: 2px dashed var(--border);
    border-radius: var(--radius-lg);
    background: transparent;
    color: var(--primary);
    font-family: 'Poppins', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
  }

  .new-list-btn:hover {
    border-color: var(--primary);
    background: var(--accent-soft);
  }

  .new-list-btn svg { width: 20px; height: 20px; }

  /* ── MASTER ENTRY ── */
  .master-btn {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    background: var(--bg-secondary);
    color: var(--text);
    font-family: 'Poppins', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 24px;
    text-align: left;
  }

  .master-btn:hover {
    border-color: var(--primary);
    background: var(--primary-lighter);
    box-shadow: var(--shadow);
  }

  .master-btn-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .master-btn-left svg { width: 20px; height: 20px; color: var(--primary); flex-shrink: 0; }

  .master-btn-texts { min-width: 0; }

  .master-btn-title {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    line-height: 1.3;
  }

  .master-btn-sub {
    font-size: 0.75rem;
    color: var(--text-lighter);
  }

  .section-title {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-lighter);
    margin-bottom: 12px;
    padding: 0 0;
  }

  .lists-grid {
    display: grid;
    gap: 12px;
    grid-template-columns: 1fr;
  }

  .list-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .list-card:hover {
    border-color: var(--primary);
    background: var(--primary-lighter);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  .list-card-info { flex: 1; min-width: 0; }

  .list-card-name {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .list-card-meta {
    font-size: 0.8rem;
    color: var(--text-lighter);
    margin-top: 4px;
  }

  .list-card-total {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--primary);
    white-space: nowrap;
  }

  .list-card-actions {
    display: flex;
    gap: 6px;
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-light);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .icon-btn:hover { 
    color: var(--text); 
    border-color: var(--primary);
    background: var(--primary-light);
  }

  .icon-btn.danger:hover { 
    color: var(--danger); 
    border-color: var(--danger);
    background: rgba(231, 76, 60, 0.1);
  }

  .icon-btn.clone:hover { 
    color: var(--primary); 
    border-color: var(--primary);
    background: var(--accent-soft);
  }

  .icon-btn svg { width: 18px; height: 18px; }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-lighter);
  }

  .empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.3; }
  .empty-state p { font-size: 0.9rem; }

  /* ── DETAIL HEADER ── */
  .detail-header {
    max-width: 100%;
    margin: 0 auto;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
  }

  .back-btn {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-light);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .back-btn:hover { 
    color: var(--primary); 
    border-color: var(--primary);
    background: var(--accent-soft);
  }

  .back-btn svg { width: 20px; height: 20px; }

  .detail-title-wrap { flex: 1; min-width: 0; }

  .detail-title-input {
    background: transparent;
    border: none;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: clamp(1.3rem, 5vw, 1.8rem);
    color: var(--text);
    width: 100%;
    outline: none;
    letter-spacing: -0.02em;
    border-bottom: 2px solid transparent;
    transition: border-color 0.2s;
    padding: 2px 0;
  }

  .detail-title-input:focus { border-bottom-color: var(--primary); }
  .detail-title-input::placeholder { color: var(--text-lighter); }

  .detail-static-title {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: clamp(1.3rem, 5vw, 1.8rem);
    letter-spacing: -0.02em;
    line-height: 1.2;
  }

  .detail-static-sub {
    font-size: 0.78rem;
    color: var(--text-lighter);
  }

  .detail-content {
    max-width: 100%;
    margin: 0 auto;
    padding: 16px;
  }

  /* ── TOTALS BAR ── */
  .totals-bar {
    background: linear-gradient(135deg, var(--primary-lighter) 0%, var(--primary-light) 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }

  .totals-stat { 
    text-align: center;
  }

  .totals-stat-label { 
    font-size: 0.7rem; 
    color: var(--text-light); 
    text-transform: uppercase; 
    letter-spacing: 0.06em;
    font-weight: 500;
  }

  .totals-stat-value {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: 1.3rem;
    margin-top: 6px;
    color: var(--text);
  }

  /* ── ADD ITEM FORM ── */
  .add-form {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 20px;
  }

  .add-form-title {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-lighter);
    margin-bottom: 14px;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    margin-bottom: 12px;
  }

  .field-group { display: flex; flex-direction: column; gap: 5px; }

  .field-label {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--text-lighter);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .field-input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-family: 'Poppins', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
    width: 100%;
  }

  .field-input:focus { 
    border-color: var(--primary); 
    background: var(--primary-lighter);
  }

  .field-input::placeholder { color: var(--text-lighter); }

  /* ── QTY STEPPER ── */
  .qty-stepper {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px;
    align-self: start;
    width: max-content;
  }

  .qty-btn {
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 6px;
    background: var(--bg-secondary);
    color: var(--primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }

  .qty-btn:hover { background: var(--primary); color: #fff; }
  .qty-btn:active { transform: scale(0.94); }
  .qty-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .qty-btn:disabled:hover { background: var(--bg-secondary); color: var(--primary); }
  .qty-btn svg { width: 16px; height: 16px; }

  .qty-value {
    width: 42px;
    text-align: center;
    border: none;
    background: transparent;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--text);
    outline: none;
    padding: 0;
    -moz-appearance: textfield;
  }

  .qty-value::-webkit-outer-spin-button,
  .qty-value::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .add-item-btn {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: var(--primary);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .add-item-btn:hover { 
    background: #f56b99;
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }

  .add-item-btn:active { transform: none; }
  .add-item-btn svg { width: 18px; height: 18px; }

  /* ── ITEMS GRID ── */
  .items-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .items-grid {
    display: grid;
    gap: 8px;
  }

  .item-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    transition: all 0.2s;
  }

  .item-card.checked {
    opacity: 0.6;
    background: #f5f5f5;
  }

  .item-card.checked .item-name {
    text-decoration: line-through;
    color: var(--text-lighter);
  }

  .item-card:hover { 
    border-width: 2px;
    border-color: var(--primary);
    box-shadow: var(--shadow);
  }

  .item-view {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    padding: 12px 14px;
    gap: 10px;
  }

  .item-view.no-check {
    grid-template-columns: 1fr auto;
  }

  .item-check {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    border: 2px solid var(--border);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .item-check:hover {
    border-color: var(--primary);
    background: var(--accent-soft);
  }

  .item-card.checked .item-check {
    background: var(--success);
    border-color: var(--success);
  }

  .item-check svg {
    width: 14px;
    height: 14px;
    color: white;
    display: none;
  }

  .item-card.checked .item-check svg {
    display: block;
  }

  .item-info {
    flex: 1;
    min-width: 0;
  }

  .item-name {
    font-weight: 500;
    font-size: 0.95rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .item-details {
    font-size: 0.75rem;
    color: var(--text-lighter);
    margin-top: 2px;
  }

  .item-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .item-price-input {
    width: 70px;
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    color: var(--text);
    font-family: 'Poppins', sans-serif;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .item-price-input:focus {
    border-color: var(--primary);
    background: var(--primary-lighter);
  }

  .item-subtotal {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--primary);
    white-space: nowrap;
    min-width: 65px;
    text-align: right;
  }

  .item-actions { display: flex; gap: 4px; }

  /* ── EDIT INLINE ── */
  .item-edit {
    display: none;
    padding: 12px 14px;
    background: var(--bg);
    border-top: 1px solid var(--border);
    gap: 10px;
    flex-direction: column;
  }

  .item-card.editing .item-edit { display: flex; }
  .item-card.editing { border-color: var(--primary); }

  .edit-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
  }

  .edit-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  .btn-sm {
    padding: 8px 14px;
    border-radius: 6px;
    border: none;
    font-family: 'Poppins', sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-sm.primary { 
    background: var(--primary); 
    color: #fff; 
    font-weight: 600;
  }

  .btn-sm.primary:hover { background: #f56b99; }

  .btn-sm.ghost { 
    background: transparent;
    color: var(--text-light); 
    border: 1px solid var(--border);
  }

  .btn-sm.ghost:hover { 
    color: var(--primary);
    border-color: var(--primary);
  }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.active { display: flex; }

  .modal {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px;
    max-width: 420px;
    width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: var(--shadow-md);
    animation: modalIn 0.25s ease;
  }

  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.95) translateY(10px); }
    to { opacity: 1; transform: none; }
  }

  .modal h2 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: 1.3rem;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
    color: var(--text);
  }

  .modal p { 
    color: var(--text-light); 
    font-size: 0.9rem; 
    margin-bottom: 20px; 
  }

  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

  /* ── SOURCE PICKER ── */
  .source-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .source-opt {
    padding: 12px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-light);
    font-family: 'Poppins', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }

  .source-opt:hover { border-color: var(--primary); color: var(--text); }

  .source-opt.active {
    border-color: var(--primary);
    background: var(--primary-lighter);
    color: var(--primary);
    font-weight: 600;
  }

  .pick-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }

  .pick-list {
    border: 1px solid var(--border);
    border-radius: 10px;
    max-height: 210px;
    overflow-y: auto;
    background: var(--bg);
  }

  .pick-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
  }

  .pick-row:last-child { border-bottom: none; }
  .pick-row:hover { background: var(--primary-lighter); }

  .pick-box {
    width: 20px;
    height: 20px;
    border-radius: 5px;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }

  .pick-box svg { width: 12px; height: 12px; color: #fff; display: none; }

  .pick-row.selected .pick-box {
    background: var(--primary);
    border-color: var(--primary);
  }

  .pick-row.selected .pick-box svg { display: block; }

  .pick-name {
    font-size: 0.88rem;
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .pick-qty {
    font-size: 0.75rem;
    color: var(--text-lighter);
    white-space: nowrap;
  }

  .btn { 
    padding: 10px 18px; 
    border-radius: 8px; 
    border: none; 
    font-family: 'Poppins', sans-serif; 
    font-size: 0.9rem; 
    font-weight: 600; 
    cursor: pointer; 
    transition: all 0.15s; 
  }

  .btn.primary { 
    background: var(--primary); 
    color: #fff;
  }

  .btn.primary:hover { 
    background: #f56b99;
